[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlir-tensoropt"
version = "0.1.0"
description = "End-to-End MLIR Deep Learning Compiler & Lowering Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Kaushal Nandaniya", email = "kaushalnandania086@gmail.com"}
]
keywords = ["mlir", "compiler", "deep-learning", "llvm", "pytorch", "tiling", "vectorization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Compilers",
]

dependencies = [
    "torch>=2.1.0",
    "torch-mlir>=20261001",
    "numpy>=1.26.0",
    "tabulate>=0.9.0",
    "rich>=13.0.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
mlir-tensoropt-demo = "mlir_tensoropt.demo:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --verbose"
testpaths = [
    "tests",
]
